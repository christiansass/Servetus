---
# deploy-wordinfilm.yml
# Ansible playbook — Servetus WordinFilm node (GTX 1080 Ti, homelab, always-on)
# Mirror of deploy-binaryranch.yml but includes GPU services (whisper, ollama)
# and Xvfb/Chromium for browser automation.
#
# Usage:
#   ansible-playbook -i inventory/wordinfilm.ini deploy-wordinfilm.yml
#   # Or direct:
#   ansible-playbook -i "wordinfilm.local," deploy-wordinfilm.yml \
#     -e vault_path=/mnt/Cloud/Nextcloud/Obsidian/Servetus

- name: Deploy Servetus WordinFilm Node
  hosts: wordinfilm
  become: true

  vars:
    vault_path: /mnt/Cloud/Nextcloud/Obsidian/Servetus
    talk_audio_path: /mnt/Cloud/Nextcloud/Talk/Audio
    docker_compose_file: docker-compose.yml
    servetus_user: servetus
    servetus_group: servetus
    compose_dir: /opt/servetus

    anthropic_api_key: "{{ lookup('env', 'ANTHROPIC_API_KEY') }}"


  tasks:

    # ── System Prerequisites ───────────────────────────────────────

    - name: Install Docker and NVIDIA Container Toolkit prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - nvidia-container-toolkit
        state: present
        update_cache: true

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker CE and Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Configure Docker to use NVIDIA runtime
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "default-runtime": "nvidia",
            "runtimes": {
              "nvidia": {
                "path": "nvidia-container-runtime",
                "runtimeArgs": []
              }
            }
          }
      notify: Restart Docker

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: true


    # ── Servetus User ──────────────────────────────────────────────

    - name: Create servetus group
      group:
        name: "{{ servetus_group }}"
        state: present

    - name: Create servetus user
      user:
        name: "{{ servetus_user }}"
        group: "{{ servetus_group }}"
        groups: docker
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Create compose directory
      file:
        path: "{{ compose_dir }}"
        state: directory
        owner: "{{ servetus_user }}"
        group: "{{ servetus_group }}"
        mode: "0750"


    # ── Vault Mount Verification ───────────────────────────────────

    - name: Verify vault path exists
      stat:
        path: "{{ vault_path }}"
      register: vault_stat
      failed_when: not vault_stat.stat.exists

    - name: Verify Talk audio path exists
      stat:
        path: "{{ talk_audio_path }}"
      register: audio_stat
      failed_when: not audio_stat.stat.exists


    # ── Deploy Compose Stack ───────────────────────────────────────

    - name: Copy docker-compose.yml
      copy:
        src: "{{ playbook_dir }}/../../docker-compose.yml"
        dest: "{{ compose_dir }}/docker-compose.yml"
        owner: "{{ servetus_user }}"
        group: "{{ servetus_group }}"
        mode: "0640"

    - name: Write environment file
      copy:
        dest: "{{ compose_dir }}/.env"
        content: |
          VAULT_PATH={{ vault_path }}
          ANTHROPIC_API_KEY={{ anthropic_api_key }}
        owner: "{{ servetus_user }}"
        group: "{{ servetus_group }}"
        mode: "0600"
      no_log: true

    - name: Start Servetus WordinFilm stack
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        files:
          - docker-compose.yml
        state: present
      environment:
        VAULT_PATH: "{{ vault_path }}"
        ANTHROPIC_API_KEY: "{{ anthropic_api_key }}"

    - name: Verify containers are running
      community.docker.docker_container_info:
        name: "{{ item }}"
      loop:
        - servetus-display
        - servetus-chromium
        - servetus-whisper
        - servetus-ollama
        - servetus-talk
        - servetus-secretary
      register: container_info
      failed_when: not container_info.container.State.Running


  handlers:
    - name: Restart Docker
      service:
        name: docker
        state: restarted
